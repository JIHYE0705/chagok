<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>차곡 · 보관함 디자인 시안</title>
  <link rel="icon" href="../../../public/chagok-note.svg" type="image/svg+xml">
  <link rel="stylesheet" href="study.css">
  <script src="study.js" defer></script>
</head>
<body data-view="cards">
  <a class="skip" href="#main">본문으로 건너뛰기</a>
  <aside class="study-bar" aria-label="시안 설정">
    <p><strong>보관함 시안</strong> · 예시 데이터, 실제 저장 없음</p>
    <label>본문 폰트 <select id="font"><option value="pretendard">Pretendard · 제안</option><option value="nanum">나눔스퀘어라운드 · 현재</option></select></label>
  </aside>
  <div class="shell">
    <header class="app-header">
      <a class="brand" href="#main" aria-label="차곡 보관함"><img src="../../../public/chagok-wordmark.svg" width="76" height="40" alt="차곡"></a>
      <span class="muted">나만의 레시피 아카이브</span>
      <button type="button" data-demo="로그아웃은 실제 앱에서 사용할 수 있어요.">로그아웃</button>
    </header>
    <main id="main" tabindex="-1">
      <div class="heading">
        <div><p class="eyebrow">다음에 또 만들어 먹고 싶은 것들</p><h1>나의 보관함</h1></div>
        <button class="primary" type="button" data-demo="등록 화면은 이번 보관함 시안에 포함하지 않았어요."><span aria-hidden="true">＋</span> 새 항목 저장</button>
      </div>
      <form id="search-form" class="search-form">
        <label class="search-label" for="query">보관함 검색<input id="query" type="search" maxlength="200" placeholder="제목, 본문, 태그, 재료 검색"></label>
        <label for="tag">태그 필터<select id="tag"><option value="">모든 태그</option><option>집밥</option><option>도시락</option><option>간식</option><option>다시 만들기</option></select></label>
        <label class="check"><input id="favorites" type="checkbox">즐겨찾기만</label>
        <button type="submit">검색</button>
      </form>
      <div class="result-toolbar">
        <p class="muted"><span id="count">4개</span><span class="separator" aria-hidden="true">·</span>최근 저장순</p>
        <div class="views" role="group" aria-label="보관함 보기 방식">
          <button type="button" data-view="cards" aria-pressed="true" aria-controls="results"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="2" width="6" height="6" rx="1"/><rect x="12" y="2" width="6" height="6" rx="1"/><rect x="2" y="12" width="6" height="6" rx="1"/><rect x="12" y="12" width="6" height="6" rx="1"/></svg>카드형</button>
          <button type="button" data-view="list" aria-pressed="false" aria-controls="results"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 4h3m4 0h9M2 10h3m4 0h9M2 16h3m4 0h9"/></svg>목록형</button>
        </div>
      </div>
      <div id="results" class="grid"></div>
      <section id="empty" class="empty" hidden><img src="../../../public/chagok-note.svg" width="48" height="48" alt=""><h2>검색 결과가 없어요</h2><p class="muted">검색어나 필터를 바꿔 보세요.</p><button id="reset" type="button">전체 보관함 보기</button></section>
      <p id="result-status" class="sr-only" role="status"></p>
      <details class="tag-manager"><summary>태그 관리</summary><p>현재 태그: 집밥 · 도시락 · 간식 · 다시 만들기</p><p class="muted">태그 추가·수정·삭제는 실제 앱에서 사용할 수 있어요.</p></details>
      <p id="demo-status" class="demo-status" role="status"></p>
    </main>
    <footer><p>Little Joy, Well Organized.</p><p>사진 · <a href="https://wtable.co.kr/recipes/314wwQZR5hXP4RMCEKzJMHfa" target="_blank" rel="noopener noreferrer">우리의식탁 땡초김밥</a> / 나머지는 표시 검토용 예시</p></footer>
  </div>
  <dialog id="detail"><div class="dialog-top"><p class="eyebrow">전체 제목 · 시안 예시</p><button id="close-detail" type="button">닫기</button></div><h2 id="detail-title"></h2><p id="detail-summary"></p><p class="muted">실제 상세 화면과 조리 정보는 연결하지 않았어요.</p></dialog>
</body>
</html>
