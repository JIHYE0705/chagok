name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  ci-check:
    name: CI Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check README.md
        shell: bash
        run: |
          test -f README.md || {
            echo "README.md is missing"
            exit 1
          }
          test -s README.md || {
            echo "README.md is empty"
            exit 1
          }

      - name: Check docs directory
        shell: bash
        run: |
          test -d docs || {
            echo "docs directory is missing"
            exit 1
          }
          find docs -type f -print -quit | grep -q . || {
            echo "docs directory is empty"
            exit 1
          }

  schema-check:
    name: App Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Test public screens in browser
        run: npm run test:e2e

  linked-db-check:
    name: Linked Supabase DB
    if: vars.SUPABASE_PROJECT_REF != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Require linked test credentials
        run: test -n "$SUPABASE_ACCESS_TOKEN"
      - run: npm run test:db
