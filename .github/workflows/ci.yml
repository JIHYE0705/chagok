name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  ci-check:
    name: CI Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check README.md
        shell: bash
        run: |
          test -f README.md || {
            echo "README.md is missing"
            exit 1
          }
          test -s README.md || {
            echo "README.md is empty"
            exit 1
          }

      - name: Check docs directory
        shell: bash
        run: |
          test -d docs || {
            echo "docs directory is missing"
            exit 1
          }
          find docs -type f -print -quit | grep -q . || {
            echo "docs directory is empty"
            exit 1
          }

  schema-check:
    name: Supabase RLS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Start disposable Supabase database
        run: npx supabase start
      - name: Test schema and user isolation
        run: npx supabase test db
      - name: Lint database functions
        run: npx supabase db lint --local --schema public --fail-on error
      - name: Check generated database row contracts
        run: |
          npx supabase gen types typescript --local --schema public > "$RUNNER_TEMP/database.types.ts"
          diff -u lib/data/types.ts "$RUNNER_TEMP/database.types.ts"
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Test local Auth sessions in browser
        run: AUTH_E2E=1 npm run test:e2e
